# Emulates the Home Assistant Supervisor's ingress proxy, enough for the e2e test.
# Runs in the add-on container's network namespace, so its requests reach the
# add-on's ingress server (127.0.0.1:8099) from 127.0.0.1, which the add-on's
# allow-list accepts. Requests outside the ingress prefix hit the "Home
# Assistant root" below and answer HA-ROOT-LEAK; the test fails if any arrive.
events {}
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  log_format leak '$status $request_method $request_uri';
  access_log /dev/stdout leak;

  server {
    listen 18123;

    location /api/hassio_ingress/e2etoken/ {
      proxy_pass http://127.0.0.1:8099/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Ingress-Path /api/hassio_ingress/e2etoken;
      # Like the Supervisor: the host the browser used to reach Home Assistant.
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header Host $host;
      proxy_read_timeout 1d;
    }

    location / { return 404 "HA-ROOT-LEAK\n"; }
  }
}
