---
name: Build & Test

# Lints the add-on, builds the image and runs the smoke test and the Ingress browser test.
# Reusable (called by auto-update.yaml) and also triggered by PRs and pushes to
# branches other than main.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or commit SHA to build and test (default is the triggering ref)
        type: string
        required: false
        default: ""
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  lint-addon:
    name: Lint add-on
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Lint add-on configuration
        uses: frenck/action-app-linter@v2
        with:
          path: ./t3code

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: t3code/Dockerfile
          failure-threshold: warning

  lint-shell:
    name: Lint shell scripts & script tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Run shellcheck
        run: scripts/lint-shell.sh

      - name: Test upstream update script
        run: tests/check-upstream.test.sh

  build-and-test:
    name: Build image, smoke & ingress e2e test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read build configuration
        id: cfg
        run: scripts/read-config.sh >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ./t3code
          build-args: ${{ steps.cfg.outputs.build_args }}
          load: true
          push: false
          provenance: false
          tags: local/t3code-amd64:ci
          cache-from: type=gha,scope=t3code-amd64
          cache-to: type=gha,scope=t3code-amd64,mode=max

      - name: Smoke test
        run: tests/smoke.sh local/t3code-amd64:ci "${{ steps.cfg.outputs.t3_version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright and Chromium
        working-directory: tests/ingress-e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium-headless-shell

      # Guards the sidebar panel against T3 Code upgrades (see tests/ingress-e2e.sh).
      - name: Ingress e2e test
        env:
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/ingress-e2e-screenshots
        run: |
          mkdir -p "${E2E_SCREENSHOT_DIR}"
          tests/ingress-e2e.sh local/t3code-amd64:ci

      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ingress-e2e-screenshots
          path: ${{ runner.temp }}/ingress-e2e-screenshots
          if-no-files-found: ignore
