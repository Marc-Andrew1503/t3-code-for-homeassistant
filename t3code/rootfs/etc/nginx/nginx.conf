# Home Assistant Ingress front for the T3 Code server (the "T3 Code" sidebar panel).
#
# The Supervisor proxies https://<ha>/api/hassio_ingress/<token>/<path> to this
# server as /<path> and sends the prefix in X-Ingress-Path. The T3 Code client
# assumes it lives at "/", so index.html and CSS get their absolute URLs
# re-rooted here and /_ingress/shim.js (loaded first) does the same for URLs the
# client builds at runtime. Started by the `ingress` s6 service, which writes
# /run/t3code/ingress-pair.conf (the auto sign-in bearer, mode 600) beforehand.
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    # No access log: request URLs and headers must not end up in the add-on log.
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Only a well-formed prefix is ever injected into HTML.
    map $http_x_ingress_path $ingress_prefix {
        default "";
        "~^/api/hassio_ingress/[A-Za-z0-9_-]+$" $http_x_ingress_path;
    }

    server {
        listen 8099;

        # Only the Supervisor (ingress proxy) may talk to this port.
        allow 172.30.32.2;
        allow 127.0.0.1;
        deny all;

        location = /_ingress/shim.js {
            alias /usr/share/t3code/ingress/shim.js;
            default_type application/javascript;
            add_header Cache-Control no-store;
        }

        # Mints a pairing credential for the shim's auto sign-in. The include
        # either proxies to T3 with a bearer or answers 404 (auto login off).
        location = /_ingress/pair {
            include /run/t3code/ingress-pair.conf;
        }

        location / {
            if ($ingress_prefix = "") {
                return 400 "Missing or invalid X-Ingress-Path\n";
            }

            proxy_pass http://127.0.0.1:3773;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
            client_max_body_size 0;

            # sub_filter cannot rewrite compressed responses.
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types text/css;
            sub_filter '<head>' '<head><script>window.__T3_INGRESS_PATH__="$ingress_prefix";</script><script src="$ingress_prefix/_ingress/shim.js"></script>';
            sub_filter 'src="/' 'src="$ingress_prefix/';
            sub_filter 'href="/' 'href="$ingress_prefix/';
            sub_filter 'url(/' 'url($ingress_prefix/';
        }
    }
}
